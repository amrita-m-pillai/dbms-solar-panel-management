<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Fault Log</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            ☀ Solar Plant Management System
        </a>

        <a class="btn btn-light" href="/">
            Dashboard
        </a>

    </div>

</nav>


<div class="container page-section">

    <div class="page-header">

        <p class="section-label">FAULT MANAGEMENT</p>

        <h1>Add Fault Log</h1>

        <p>
            Record a new equipment fault.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Equipment Type
                </label>

                <select
                    name="equip_type"
                    class="form-control"
                    required>

                    <option value="">Select Equipment</option>

                    <option value="Solar Panel">
                        Solar Panel
                    </option>

                    <option value="Inverter">
                        Inverter
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Equipment ID
                </label>

                <input
                    type="number"
                    name="equip_id"
                    class="form-control"
                    placeholder="Enter equipment ID"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Fault Description
                </label>

                <textarea
                    name="fault"
                    class="form-control"
                    rows="3"
                    placeholder="Describe the fault"
                    required></textarea>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Severity
                </label>

                <select
                    name="severity"
                    class="form-control"
                    required>

                    <option value="">Select Severity</option>

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Fault Date
                </label>

                <input
                    type="date"
                    name="fault_date"
                    class="form-control"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Status
                </label>

                <select
                    name="status"
                    class="form-control"
                    required>

                    <option value="">Select Status</option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Resolved">
                        Resolved
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Add Fault Log

            </button>


            <a
                href="/faults"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
