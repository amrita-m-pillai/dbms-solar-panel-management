<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alerts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            ☀ Solar Plant Management System
        </a>

        <a class="btn btn-light" href="/">
            Dashboard
        </a>

    </div>

</nav>


<div class="container page-section">

    <div class="page-header">

        <p class="section-label">ALERT MANAGEMENT</p>

        <h1>Alerts</h1>

        <p>
            Monitor plant and equipment-related alerts.
        </p>

    </div>


    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>
                        <th>Plant</th>
                        <th>Alert Type</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>

                </thead>


                <tbody>

                    {% for alert in alerts %}

                    <tr>

                        <td>{{ alert[0] }}</td>

                        <td>{{ alert[1] }}</td>

                        <td>{{ alert[2] }}</td>

                        <td>{{ alert[3] }}</td>

                        <td>
                            <span class="status-badge">
                                {{ alert[4] }}
                            </span>
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
