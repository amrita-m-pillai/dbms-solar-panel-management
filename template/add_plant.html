<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Solar Plant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            ☀ Solar Plant Management System
        </a>

        <a class="btn btn-light" href="/">
            Dashboard
        </a>

    </div>

</nav>


<div class="container page-section">

    <div class="page-header">

        <p class="section-label">PLANT MANAGEMENT</p>

        <h1>Add Solar Plant</h1>

        <p>
            Enter the details of a new solar plant.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Plant Name
                </label>

                <input
                    type="text"
                    name="plant_name"
                    class="form-control"
                    placeholder="Enter plant name"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Location
                </label>

                <input
                    type="text"
                    name="location"
                    class="form-control"
                    placeholder="Enter location"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Capacity (MW)
                </label>

                <input
                    type="number"
                    name="capacity"
                    class="form-control"
                    step="0.01"
                    placeholder="Enter capacity"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Commission Date
                </label>

                <input
                    type="date"
                    name="commission_date"
                    class="form-control"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Add Solar Plant

            </button>


            <a
                href="/"
                class="btn btn-secondary">

                Cancel

            </a>


        </form>

    </div>

</div>

</body>
</html>
