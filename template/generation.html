<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Power Generation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            ☀ Solar Plant Management System
        </a>

        <a class="btn btn-light" href="/">
            Dashboard
        </a>

    </div>

</nav>


<div class="container page-section">

    <div class="page-header">

        <p class="section-label">POWER MONITORING</p>

        <h1>Power Generation</h1>

        <p>
            View energy generation, peak power and efficiency.
        </p>

    </div>


    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>
                        <th>Plant</th>
                        <th>Date</th>
                        <th>Energy (kWh)</th>
                        <th>Peak Power (MW)</th>
                        <th>Efficiency (%)</th>
                    </tr>

                </thead>


                <tbody>

                    {% for item in generation %}

                    <tr>

                        <td>{{ item[0] }}</td>

                        <td>{{ item[1] }}</td>

                        <td>{{ item[2] }}</td>

                        <td>{{ item[3] }}</td>

                        <td>{{ item[4] }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
