<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Inventory Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            ☀ Solar Plant Management System
        </a>

        <a class="btn btn-light" href="/">
            Dashboard
        </a>

    </div>

</nav>


<div class="container page-section">

    <div class="page-header">

        <p class="section-label">RESOURCE MANAGEMENT</p>

        <h1>Add Inventory Item</h1>

        <p>
            Add a new item to the inventory.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Item Name
                </label>

                <input
                    type="text"
                    name="item"
                    class="form-control"
                    placeholder="Enter item name"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Quantity
                </label>

                <input
                    type="number"
                    name="qty"
                    class="form-control"
                    min="0"
                    placeholder="Enter quantity"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Supplier
                </label>

                <input
                    type="text"
                    name="supplier"
                    class="form-control"
                    placeholder="Enter supplier name"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Unit Cost (₹)
                </label>

                <input
                    type="number"
                    name="unit_cost"
                    class="form-control"
                    step="0.01"
                    min="0"
                    placeholder="Enter unit cost"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Add Inventory Item

            </button>


            <a
                href="/inventory"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
