<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Maintenance Record</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            ☀ Solar Plant Management System
        </a>

        <a class="btn btn-light" href="/">
            Dashboard
        </a>

    </div>

</nav>


<div class="container page-section">

    <div class="page-header">

        <p class="section-label">MAINTENANCE MANAGEMENT</p>

        <h1>Add Maintenance Record</h1>

        <p>
            Enter details of a maintenance activity.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Employee ID
                </label>

                <input
                    type="number"
                    name="emp_id"
                    class="form-control"
                    placeholder="Enter employee ID"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Equipment Type
                </label>

                <select
                    name="equip_type"
                    class="form-control"
                    required>

                    <option value="">Select Equipment</option>

                    <option value="Solar Panel">
                        Solar Panel
                    </option>

                    <option value="Inverter">
                        Inverter
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Equipment ID
                </label>

                <input
                    type="number"
                    name="equip_id"
                    class="form-control"
                    placeholder="Enter equipment ID"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Maintenance Date
                </label>

                <input
                    type="date"
                    name="maint_date"
                    class="form-control"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Remarks
                </label>

                <textarea
                    name="remarks"
                    class="form-control"
                    rows="4"
                    placeholder="Enter maintenance details"
                    required></textarea>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Add Maintenance Record

            </button>


            <a
                href="/maintenance"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
